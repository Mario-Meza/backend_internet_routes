# pyproject.toml
[project]
name = "rutas-digitales"
version = "0.1.0"
description = "API Backend para gestión y despacho de rutas técnicas en tiempo real"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.0",
    "cloudinary>=1.41.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.9.0",
    "pymongo>=4.13",
    "pytest>=9.2.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]
