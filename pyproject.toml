[project]
name = "rutas-digitales"
version = "0.1.0"
description = "API Backend para gestión y despacho de rutas técnicas en tiempo real"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.0",
    "cloudinary>=1.41.0",
    "fastapi>=0.115.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pymongo>=4.10.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".idea", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]